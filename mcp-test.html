<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUDHANIA MCP Diagnostic</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#111;color:#eee;padding:20px;line-height:1.45}main{max-width:760px;margin:auto}h1{font-size:24px}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700}pre{white-space:pre-wrap;background:#1c1c1c;padding:14px;border-radius:12px;overflow:auto}.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#aaa}.row{margin:12px 0}
</style>
</head>
<body>
<main>
<h1>YUDHANIA.AI — MCP Server Diagnostic</h1>
<p class="muted">This page tests the MCP endpoint from Safari without Node.js.</p>
<button id="run">Run MCP Test</button>
<div id="status" class="row"></div>
<pre id="out">Ready.</pre>
<script>
const out=document.getElementById('out'),status=document.getElementById('status');
function log(x){out.textContent+=x+'\n';}
function pickPayload(text){
  try{return JSON.parse(text)}catch{}
  const lines=text.split(/\r?\n/).filter(x=>x.startsWith('data:'));
  for(const line of lines){try{return JSON.parse(line.slice(5).trim())}catch{}}
  return null;
}
async function rpc(id,method,params,session){
  const headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream','Mcp-Protocol-Version':'2025-11-25'};
  if(session) headers['Mcp-Session-Id']=session;
  const r=await fetch('/mcp',{method:'POST',headers,body:JSON.stringify({jsonrpc:'2.0',id,method,params})});
  const text=await r.text();
  const payload=pickPayload(text);
  return {r,text,payload,session:r.headers.get('Mcp-Session-Id')||session};
}
async function run(){
 out.textContent=''; status.innerHTML='Testing…';
 try{
  const init=await rpc(1,'initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'YUDHANIA Safari Diagnostic',version:'1.0'}},null);
  log(`initialize HTTP: ${init.r.status} ${init.r.statusText}`);
  log(`session: ${init.session||'(none)'}`);
  log(`initialize response:\n${JSON.stringify(init.payload||init.text,null,2)}`);
  if(!init.r.ok || !init.payload || init.payload.error) throw new Error('initialize failed');
  const noteHeaders={'Content-Type':'application/json','Accept':'application/json, text/event-stream','Mcp-Protocol-Version':'2025-11-25'};
  if(init.session) noteHeaders['Mcp-Session-Id']=init.session;
  await fetch('/mcp',{method:'POST',headers:noteHeaders,body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized',params:{}})});
  const tools=await rpc(2,'tools/list',{},init.session);
  log(`\ntools/list HTTP: ${tools.r.status} ${tools.r.statusText}`);
  log(`tools/list response:\n${JSON.stringify(tools.payload||tools.text,null,2)}`);
  if(!tools.r.ok || !tools.payload || tools.payload.error) throw new Error('tools/list failed');
  const names=(tools.payload.result?.tools||[]).map(t=>t.name);
  status.innerHTML=`<span class="ok">✓ MCP initialize passed<br>✓ tools/list passed<br>✓ ${names.length} tool(s) discovered</span>`;
 }catch(e){
  status.innerHTML=`<span class="bad">✗ MCP test failed: ${e.message}</span>`;
  log('\nFAILURE: '+e.stack);
 }
}
document.getElementById('run').onclick=run;
</script>
</main>
</body>
</html>
